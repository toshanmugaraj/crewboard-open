# Static hosting for the CrewBoard widget bundle. Single-page app: unknown
# paths fall back to index.html since routing is client-side (HashRouter).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Element loads this in an <iframe> — don't send X-Frame-Options: DENY
    # (there is no such header set here by default; just documenting why).

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references the current build's content-hashed bundle
    # (assets/index-<hash>.js). Every deploy replaces dist/ wholesale, so an
    # old hash is gone entirely once a new image ships -- a browser that
    # cached a stale index.html (nothing here previously told it not to)
    # will then 404 fetching that vanished old bundle. Bit us specifically
    # via the "Open in a separate window" companion popup (Layout.jsx's
    # openCompanionWindow()): that's a fresh window.open() top-level
    # navigation, i.e. a brand-new HTTP request for index.html, which is
    # exactly where a stale cached copy gets served/reused -- the
    # already-running widget iframe never re-fetches index.html so it
    # doesn't hit this. Explicitly forcing revalidation on index.html (but
    # NOT on the hashed assets, which are safe to cache hard since their
    # filename changes whenever their content does) fixes this at the root.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # env.js is regenerated from PLAUSIBLE_API_HOST/PLAUSIBLE_DOMAIN env vars
    # on every container start (see /docker-entrypoint.d/40-generate-env-js.sh)
    # — it is NOT content-hashed like the bundle below, so it must be
    # explicitly excluded from the long-lived immutable caching the generic
    # .js rule below applies, or a browser could keep using stale/blank
    # Plausible config for up to a year after a redeploy changed it.
    location = /env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Interactive user guide (2026-08-09, frontend/public/guide/) — a small
    # static site served alongside the widget bundle (Layout.jsx's "Guide"
    # nav icon opens /guide/ in a new tab). Nothing under here is
    # content-hashed — not the engine files (index.html/app.js/styles.css/
    # data.js) and not the annotated JPEGs in assets/ either, since
    # annotate.py always writes the same fixed filenames (e.g.
    # map-browse-01.jpg) in place. Same situation as env.js above: without
    # an explicit no-cache rule a browser that loaded the guide once would
    # never see a future content update (corrected badge placement, a
    # data.js wording fix, a new screenshot) without a hard refresh. Uses
    # ^~ so this prefix wins outright over the generic long-lived-cache
    # regex below for everything under /guide/.
    location ^~ /guide/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
